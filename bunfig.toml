[install]
# Only resolve package versions published at least 7 days ago. Most malicious
# npm releases are caught and pulled within hours to days, so this sidesteps
# them for any `bun add` / `bun update`. Matches the Dependabot cooldown in
# .github/dependabot.yml. Installs from the committed bun.lock are unaffected.
minimumReleaseAge = 604800

[test]
preload = ["./test/setup.ts"]
